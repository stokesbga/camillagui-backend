name: Build and release

on:
  push:
  workflow_dispatch:
    inputs:
      targets:
        description: Platforms to bundle
        type: choice
        options: [raspberry-pi-64, all]
        default: raspberry-pi-64
      frontend_ref:
        description: Frontend branch, tag or SHA (blank uses versions.yml)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.settings.outputs.repository }}
      ref: ${{ steps.settings.outputs.ref }}
      matrix: ${{ steps.settings.outputs.matrix }}
      all: ${{ steps.settings.outputs.all }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - id: settings
        env:
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          TARGETS: ${{ inputs.targets }}
        run: |
          python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          versions = yaml.safe_load(Path('release_automation/versions.yml').read_text())
          all_platforms = os.environ['TARGETS'] == 'all' or os.environ['GITHUB_REF'].startswith('refs/tags/')
          matrix = [dict(os='ubuntu-22.04-arm', asset='bundle_linux_aarch64.tar.gz')]
          if all_platforms:
              matrix += [
                  dict(os='ubuntu-22.04', asset='bundle_linux_amd64.tar.gz'),
                  dict(os='windows-latest', asset='bundle_windows_amd64.zip'),
                  dict(os='macos-latest', asset='bundle_macos_aarch64.tar.gz'),
                  dict(os='macos-15-intel', asset='bundle_macos_intel.tar.gz'),
              ]
          values = {
              'repository': versions['camillagui_repository'],
              'ref': os.environ['FRONTEND_REF'] or versions['camillagui_tag'],
              'matrix': json.dumps({'include': matrix}),
              'all': str(all_platforms).lower(),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in values.items():
                  if '\n' in value or '\r' in value:
                      raise ValueError('Settings must be single-line values')
                  print(f'{key}={value}', file=out)
          PY

  frontend:
    needs: settings
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.settings.outputs.repository }}
          ref: ${{ needs.settings.outputs.ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: build
          if-no-files-found: error

  source:
    needs: [settings, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jinja2 PyYAML
      - run: python -Bm release_automation.render_env_files --output-dir .release-env
      - run: python -m pip install -r .release-env/requirements.txt pytest-aiohttp
      - run: python -Bm pytest
      - name: Remove test-generated state file
        run: rm -f tests/testfiles/statefile.yml
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: build
      - name: Stage source distribution
        env:
          FRONTEND_REPOSITORY: ${{ needs.settings.outputs.repository }}
          FRONTEND_SHA: ${{ needs.frontend.outputs.sha }}
        run: >-
          python -Bm release_automation.package source
          --frontend-repository "$FRONTEND_REPOSITORY" --frontend-ref "$FRONTEND_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: release-dist/source
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            release-dist/camillagui.zip
            release-dist/camillagui.zip.sha256
          if-no-files-found: error

  native:
    name: Bundle ${{ matrix.asset }}
    needs: [settings, source]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.settings.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Freeze, smoke-test and archive
        env:
          ASSET_NAME: ${{ matrix.asset }}
        shell: bash
        run: python -Bm release_automation.package bundle --asset-name "$ASSET_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            release-dist/${{ matrix.asset }}
            release-dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  qemu:
    if: needs.settings.outputs.all == 'true'
    needs: [settings, source]
    runs-on: ubuntu-22.04
    name: Bundle Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7, armv6]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-source
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: bookworm
          dockerRunArgs: --volume "${PWD}:/cdsp"
          install: |
            apt-get update
            apt-get install -y git python3 python3-pip python3-venv python3-dev build-essential binutils pkg-config
          run: |
            cd /cdsp
            python3 -m venv /tmp/release-venv
            /tmp/release-venv/bin/python -m pip install --extra-index-url https://www.piwheels.org/simple -r requirements.txt pyinstaller
            /tmp/release-venv/bin/python -Bm release_automation.package bundle --asset-name bundle_linux_${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle_linux_${{ matrix.arch }}.tar.gz
          path: |
            release-dist/bundle_linux_${{ matrix.arch }}.tar.gz
            release-dist/bundle_linux_${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, native, qemu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
